<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Dallas Avenue - Gestion</title>
<style>
  :root{
    --gold:#c9a227;
    --gold-light:#f3e7c4;
    --black:#111111;
    --bg:#f7f5f0;
    --card:#ffffff;
    --border:#e3ddc9;
    --text:#1c1c1a;
    --muted:#7a766a;
    --danger:#a3352f;
    --green:#2f7d4f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding-bottom:76px;
  }
  .wrap{max-width:480px;margin:0 auto;padding:0 14px;}
  header.topbar{
    background:var(--black);
    color:var(--gold);
    padding:14px 14px 16px;
    display:flex;
    align-items:center;
    gap:10px;
    position:sticky;
    top:0;
    z-index:20;
  }
  header.topbar img{width:38px;height:38px;border-radius:50%;flex:none;}
  header.topbar .titles{line-height:1.2;}
  header.topbar .titles .t1{font-weight:700;font-size:15px;letter-spacing:.02em;}
  header.topbar .titles .t2{font-size:11px;color:#d8c98a;}
  h2.section-title{font-size:16px;margin:16px 0 10px;color:var(--black);}
  h3.sub-title{font-size:13px;margin:14px 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px 14px;
    margin-bottom:10px;
  }
  .row{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .row + .row{margin-top:4px;}
  label{display:block;font-size:12px;color:var(--muted);margin:8px 0 3px;}
  input,select,textarea{
    width:100%;
    padding:9px 10px;
    border:1px solid var(--border);
    border-radius:8px;
    font-size:14px;
    background:#fff;
    color:var(--text);
    font-family:inherit;
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);border-color:var(--gold);}
  .btn{
    display:inline-block;
    padding:10px 14px;
    border-radius:8px;
    border:1px solid var(--black);
    background:var(--black);
    color:var(--gold);
    font-size:14px;
    font-weight:600;
    text-align:center;
    cursor:pointer;
  }
  .btn.secondary{background:#fff;color:var(--black);border-color:var(--border);}
  .btn.danger{background:#fff;color:var(--danger);border-color:var(--danger);}
  .btn.block{width:100%;margin-top:10px;}
  .btn.small{padding:5px 9px;font-size:12px;}
  .pill{display:inline-block;padding:2px 8px;border-radius:20px;background:var(--gold-light);color:#5c4a10;font-size:11px;font-weight:600;}
  .pill.alert{background:#fbe0de;color:#8a241c;}
  .item{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);}
  .item:last-child{border-bottom:none;}
  .item .name{font-size:14px;font-weight:500;}
  .item .meta{font-size:12px;color:var(--muted);}
  .item .price{font-size:14px;font-weight:600;white-space:nowrap;}
  .cat-header{font-size:12px;font-weight:700;color:#8a6d0e;margin:12px 0 4px;text-transform:uppercase;letter-spacing:.03em;}
  .metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
  .metric{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px;}
  .metric .lbl{font-size:11px;color:var(--muted);margin-bottom:3px;}
  .metric .val{font-size:19px;font-weight:700;}
  table.mini{width:100%;border-collapse:collapse;font-size:12px;}
  table.mini th{text-align:left;color:var(--muted);font-weight:600;padding:5px 4px;border-bottom:1px solid var(--border);font-size:11px;}
  table.mini td{padding:6px 4px;border-bottom:1px solid var(--border);}
  table.mini tr:last-child td{border-bottom:none;}
  .empty{color:var(--muted);font-size:13px;padding:14px 0;text-align:center;}
  .icon-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;padding:4px 6px;}
  .icon-btn.danger{color:var(--danger);}
  nav.bottomnav{
    position:fixed;bottom:0;left:0;right:0;
    background:var(--black);
    display:flex;
    z-index:30;
    box-shadow:0 -2px 8px rgba(0,0,0,.15);
  }
  nav.bottomnav button{
    flex:1;background:none;border:none;color:#a99a5e;padding:9px 2px 8px;
    font-size:10.5px;font-family:inherit;cursor:pointer;
  }
  nav.bottomnav button .ic{display:block;font-size:17px;margin-bottom:2px;}
  nav.bottomnav button.active{color:var(--gold);}
  .subtabs{display:flex;gap:6px;margin-bottom:12px;}
  .subtabs button{flex:1;padding:9px 4px;border-radius:8px;border:1px solid var(--border);background:#fff;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;font-family:inherit;}
  .subtabs button.active{background:var(--black);color:var(--gold);border-color:var(--black);}
  .view{display:none;}
  .view.active{display:block;padding-top:12px;}
  .facline{border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;}
  .toast{
    position:fixed;left:50%;bottom:90px;transform:translateX(-50%);
    background:var(--black);color:#fff;padding:9px 16px;border-radius:20px;
    font-size:13px;z-index:50;opacity:0;transition:opacity .25s;pointer-events:none;
  }
  .toast.show{opacity:1;}
  .banner-note{font-size:11px;color:var(--muted);background:var(--gold-light);border-radius:8px;padding:8px 10px;margin-bottom:10px;}
  .facture-summary{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:#fff;}
</style>
</head>

async function cloudCreateBin(cfg){
  var res = await fetch('https://api.jsonbin.io/v3/b', {
    method:'POST',
    headers: { 'Content-Type':'application/json', 'X-Master-Key': cfg.apiKey, 'X-Bin-Name':'dallas_avenue_sync' },
    body: JSON.stringify(buildFullPayload())
  });
  if(!res.ok) throw new Error('create_failed');
  var json = await res.json();
  var id = json.metadata && json.metadata.id;
  if(!id) throw new Error('no_id');
  return id;
}
async function cloudPush(){
  var cfg = getSyncConfig();
  if(!cfg.apiKey || !cfg.binId) return;
  var payload = buildFullPayload();
  var res = await fetch('https://api.jsonbin.io/v3/b/'+cfg.binId, {
    method:'PUT',
    headers: { 'Content-Type':'application/json', 'X-Master-Key': cfg.apiKey },
    body: JSON.stringify(payload)
  });
  if(!res.ok) throw new Error('push_failed');
  lastKnownRemoteUpdatedAt = payload.updated_at;
}
async function cloudPull(){
  var cfg = getSyncConfig();
  if(!cfg.apiKey || !cfg.binId) return null;
  var res = await fetch('https://api.jsonbin.io/v3/b/'+cfg.binId+'/latest', {
    headers: { 'X-Master-Key': cfg.apiKey }
  });
  if(!res.ok) throw new Error('pull_failed');
  var json = await res.json();
  return json.record || json;
}
function scheduleCloudPush(){
  var cfg = getSyncConfig();
  if(!cfg.enabled || !cfg.apiKey || !cfg.binId) return;
  clearTimeout(syncPushTimer);
  syncPushTimer = setTimeout(function(){
    cloudPush().catch(function(){});
  }, 1500);
}
async function setupSync(){
  var apiKey = document.getElementById('syncApiKey').value.trim();
  var binId = document.getElementById('syncBinId').value.trim();
  var enabled = document.getElementById('syncEnabled').checked;
  if(!apiKey){ showToast('Colle ta clé API JSONBin'); return; }
  var cfg = { apiKey:apiKey, binId:binId, enabled:enabled };
  showToast('Connexion en cours...');
  try{
    if(!cfg.binId){
      cfg.binId = await cloudCreateBin(cfg);
      saveSyncConfig(cfg);
      showToast('Espace de synchro créé : ' + cfg.binId);
    } else {
      saveSyncConfig(cfg);
      var remote = await cloudPull();
      if(remote){
        applyFullPayload(remote);
        lastKnownRemoteUpdatedAt = remote.updated_at;
      }
      showToast('Connecté - données récupérées depuis l\'autre appareil');
    }
    startSyncPolling();
    renderers.finances();
  }catch(e){
    showToast('Échec de connexion - vérifie la clé et l\'ID');
  }
}
async function syncMaintenant(){
  var cfg = getSyncConfig();
  if(!cfg.apiKey || !cfg.binId){ showToast('Configure d\'abord la synchronisation'); return; }
  showToast('Synchronisation...');
  try{
    var remote = await cloudPull();
    if(remote && remote.updated_at && remote.updated_at !== lastKnownRemoteUpdatedAt){
      applyFullPayload(remote);
      lastKnownRemoteUpdatedAt = remote.updated_at;
      renderCurrentView();
    }
    await cloudPush();
    showToast('Synchronisé avec succès');
  }catch(e){
    showToast('Synchronisation impossible - vérifie ta connexion');
  }
}
function startSyncPolling(){
  clearInterval(syncPollTimer);
  var cfg = getSyncConfig();
  if(!cfg.enabled || !cfg.apiKey || !cfg.binId) return;
  syncPollTimer = setInterval(function(){
    cloudPull().then(function(remote){
      if(remote && remote.updated_at && remote.updated_at !== lastKnownRemoteUpdatedAt){
        applyFullPayload(remote);
        lastKnownRemoteUpdatedAt = remote.updated_at;
        renderCurrentView();
        showToast('Données mises à jour (autre appareil)');
      }
    }).catch(function(){});
  }, 20000);
}

async function loadAll(){
  DB.soins = await loadKey(KEYS.soins, SOINS_SEED.slice());
  DB.journal = await loadKey(KEYS.journal, []);
  DB.produits = await loadKey(KEYS.produits, PRODUITS_SEED.slice());
  DB.ventes = await loadKey(KEYS.ventes, []);
  DB.factures = await loadKey(KEYS.factures, []);
  DB.depenses = await loadKey(KEYS.depenses, []);
  DB.dettes = await loadKey(KEYS.dettes, []);
  DB.clients = await loadKey(KEYS.clients, []);
  DB.compteurs = await loadKey(KEYS.compteurs, null);
  if(!DB.compteurs){
    var maxFP=0, maxFS=0;
    DB.factures.forEach(function(f){
      var m = /^(FP|FS)-(\d+)$/.exec(f.numero||'');
      if(m){ var n=parseInt(m[2],10); if(m[1]==='FP') maxFP=Math.max(maxFP,n); else maxFS=Math.max(maxFS,n); }
    });
    DB.compteurs = { factureProduit:maxFP, factureSoin:maxFS, vente:0 };
    saveKey(KEYS.compteurs, DB.compteurs);
  }
}
function peekNumero(type){
  var n = (DB.compteurs[type]||0) + 1;
  var prefix = type==='factureProduit' ? 'FP-' : type==='factureSoin' ? 'FS-' : 'V-';
  return prefix + String(n).padStart(4,'0');
}
function consumeNumero(type){
  DB.compteurs[type] = (DB.compteurs[type]||0) + 1;
  saveKey(KEYS.compteurs, DB.compteurs);
  var prefix = type==='factureProduit' ? 'FP-' : type==='factureSoin' ? 'FS-' : 'V-';
  return prefix + String(DB.compteurs[type]).padStart(4,'0');
}
function inPeriode(dateStr, periode){
  if(!periode) return true;
  return !!dateStr && dateStr.slice(0,7)===periode;
}

function produitCalc(p){
  var coutTransport = p.prixAchat * p.pct;
  var achatTotal = p.prixAchat + coutTransport;
  var marge = p.prixVente - achatTotal;
  var margePct = achatTotal ? (marge/achatTotal) : 0;
  return { coutTransport:coutTransport, achatTotal:achatTotal, marge:marge, margePct:margePct };
}
function stockVendu(produitId){
  return DB.ventes.filter(function(v){return v.produitId===produitId;}).reduce(function(a,v){return a+v.qte;},0);
}
function stockRestant(p){
  return p.stock - stockVendu(p.id);
}

function handleProdPhoto(input){
  var file = input.files && input.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(e){
    var img = new Image();
    img.onload = function(){
      var maxDim = 640;
      var scale = Math.min(1, maxDim/Math.max(img.width, img.height));
      var cw = Math.round(img.width*scale), ch = Math.round(img.height*scale);
      var canvas = document.createElement('canvas');
      canvas.width = cw; canvas.height = ch;
      canvas.getContext('2d').drawImage(img, 0, 0, cw, ch);
      var dataUrl = canvas.toDataURL('image/jpeg', 0.7);
      prodPhotoTemp = dataUrl;
      var prev = document.getElementById('prodPhotoPreview');
      if(prev) prev.innerHTML = '<img src="'+dataUrl+'" style="width:100%;max-width:180px;border-radius:8px;margin-top:8px;display:block;">';
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function loadImagePromise(src){

async function buildFactureCanvas(f){
  var W = 800;
  var lineH = 34;
  var headerH = 170;
  var metaH = 92;
  var tableHeaderH = 40;
  var linesH = Math.max(1, f.lignes.length) * lineH;
  var totalsH = f.remise ? 150 : 120;
  var footerH = 140;
  var H = headerH + metaH + tableHeaderH + linesH + totalsH + footerH;

  var canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  var ctx = canvas.getContext('2d');

  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0,0,W,H);

  ctx.fillStyle = '#111111';
  ctx.fillRect(0,0,W,headerH);

  try{
    var logoImg = await loadImagePromise('data:image/jpeg;base64,'+LOGO_INVOICE_B64);
    var logoSize = 110;
    ctx.drawImage(logoImg, 30, (headerH-logoSize)/2, logoSize, logoSize);
  }catch(e){}

  var textX = 30+110+20;
  var padTop = 42;
  ctx.fillStyle = '#c9a227';
  ctx.font = 'bold 30px sans-serif';
  ctx.fillText('DALLAS AVENUE', textX, padTop);
  ctx.font = '13px sans-serif';
  ctx.fillStyle = '#d8c98a';
  ctx.fillText('Institut de beauté & vente de produits bien-être', textX, padTop+26);
  ctx.font = '12px sans-serif';
  ctx.fillStyle = '#a99a5e';
  ctx.fillText('Nioro du Sahel, Koulouba', textX, padTop+46);
  ctx.fillText('Tél : 71 74 74 15', textX, padTop+64);

  ctx.textAlign = 'right';
  ctx.fillStyle = '#c9a227';
  ctx.font = 'bold 22px sans-serif';
  ctx.fillText('FACTURE', W-30, headerH/2 - 10);
  ctx.font = '16px sans-serif';
  ctx.fillStyle = '#ffffff';
  ctx.fillText(f.numero, W-30, headerH/2 + 16);
  ctx.textAlign = 'left';

  var y = headerH + 38;
  ctx.fillStyle = '#111111';
  ctx.font = 'bold 15px sans-serif';
  ctx.fillText('Date : ' + formatDateFr(f.date), 30, y);
  ctx.fillText('Client : ' + (f.client||'-'), 30, y+26);
  if(f.tel){ ctx.fillText('Téléphone : ' + f.tel, 30, y+52); }

  y = headerH + metaH;
  ctx.fillStyle = '#f3e7c4';
  ctx.fillRect(30, y, W-60, tableHeaderH);
  ctx.fillStyle = '#111111';
  ctx.font = 'bold 14px sans-serif';
  ctx.fillText('DÉSIGNATION', 45, y+26);
  ctx.fillText('QTÉ', W-330, y+26);
  ctx.fillText('PRIX U.', W-235, y+26);
  ctx.fillText('TOTAL', W-115, y+26);
  y += tableHeaderH;

  ctx.font = '14px sans-serif';
  f.lignes.forEach(function(l, i){
    ctx.fillStyle = i%2===0 ? '#ffffff' : '#faf8f2';
    ctx.fillRect(30, y, W-60, lineH);
    ctx.fillStyle = '#111111';
    ctx.fillText(truncateText(l.designation, 32), 45, y+22);
    ctx.fillText(String(l.qte), W-330, y+22);
    ctx.fillText(fmt(l.prix), W-235, y+22);
    ctx.fillText(fmt(l.total), W-115, y+22);
    y += lineH;
  });

  y += 24;
  ctx.textAlign = 'right';
  ctx.font = '15px sans-serif';
  ctx.fillStyle = '#111111';
  ctx.fillText('Sous-total : ' + fmt(f.total+f.remise), W-30, y); y += 26;
  if(f.remise){ ctx.fillText('Remise : -' + fmt(f.remise), W-30, y); y += 26; }
  ctx.font = 'bold 24px sans-serif';
  ctx.fillText('TOTAL : ' + fmt(f.total), W-30, y); y += 44;
  ctx.textAlign = 'left';

  ctx.strokeStyle = '#e3ddc9';
  ctx.beginPath(); ctx.moveTo(30,y); ctx.lineTo(W-30,y); ctx.stroke();
  y += 32;
  ctx.textAlign = 'center';
  ctx.font = 'bold 14px sans-serif';
  ctx.fillStyle = '#8a6d0e';
  ctx.fillText('BEAUTÉ  •  CONFIANCE  •  ATTITUDE', W/2, y);
  y += 24;
  ctx.font = '12px sans-serif';
  ctx.fillStyle = '#7a766a';
  ctx.fillText('Tél : 71 74 74 15   •   TikTok : Dallas Avenue', W/2, y);
  y += 26;
  ctx.font = 'italic 13px sans-serif';
  ctx.fillText('Merci de votre confiance - Dallas Avenue', W/2, y);
  ctx.textAlign = 'left';

  return canvas;
}
async function partagerFacture(id){
  var f = DB.factures.find(function(x){return x.id===id;});
  if(!f) return;
  showToast('Préparation de la facture...');
  var canvas;
  try{
    canvas = await buildFactureCanvas(f);
  }catch(e){
    showToast('Erreur lors de la génération');
    return;
  }
  canvas.toBlob(async function(blob){
    if(!blob){ showToast('Erreur de génération'); return; }
    var file = new File([blob], 'facture_'+f.numero+'.png', {type:'image/png'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{
        await navigator.share({ files:[file], title:'Facture '+f.numero, text:'Facture Dallas Avenue '+f.numero });
        return;
      }catch(e){
        return;
      }
    }
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'facture_'+f.numero+'.png';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    showToast('Image téléchargée - à partager depuis ta galerie');
  }, 'image/png');
}

        '<div class="meta">'+d.date+(d.note?' &middot; '+escHtml(d.note):'')+'</div>' +
        '</div><div class="row" style="gap:6px;">' +
        '<span class="price" style="'+(d.paye?'color:var(--muted);text-decoration:line-through;':'color:var(--danger);')+'">'+fmt(d.montant)+'</span>' +
        (!d.paye ? '<button class="icon-btn" onclick="marquerDettePayee(\''+d.id+'\')">&#10003;</button>' : '') +
        '<button class="icon-btn danger" onclick="deleteDette(\''+d.id+'\')">&#128465;</button>' +
        '</div></div>';
    }).join('') || '<div class="empty">Aucune dette enregistrée.</div>';
    body =
      '<div class="metric-grid"><div class="metric" style="grid-column:1/3;"><div class="lbl">Total dû (non payé)</div><div class="val" style="color:var(--danger);">'+fmt(totalDettes)+'</div></div></div>' +
      '<div class="card">' +
        '<label>Cliente / client</label><input type="text" id="dettCliente" list="clientsDatalist" placeholder="Nom">' +
        '<label>Date</label><input type="date" id="dettDate" value="'+todayISO()+'">' +
        '<label>Montant dû</label><input type="number" id="dettMontant" placeholder="0">' +
        '<label>Note (optionnel)</label><input type="text" id="dettNote" placeholder="Ex : reste sur facture FS-0002">' +
        '<button class="btn block" onclick="addDette()">Enregistrer la dette</button>' +
      '</div>' + clientsDatalistHtml() +
      '<h3 class="sub-title">Liste des dettes</h3>' + list;
  } else {
    var journalRF = resumePeriode ? DB.journal.filter(function(j){return inPeriode(j.date, resumePeriode);}) : DB.journal;
    var ventesRF = resumePeriode ? DB.ventes.filter(function(v){return inPeriode(v.date, resumePeriode);}) : DB.ventes;
    var depensesRF = resumePeriode ? DB.depenses.filter(function(d){return inPeriode(d.date, resumePeriode);}) : DB.depenses;
    var caSoins = journalRF.reduce(function(a,j){return a+j.prix;},0);
    var caProduits = ventesRF.reduce(function(a,v){return a+v.total;},0);
    var caTotal = caSoins + caProduits;
    var totalDep2 = depensesRF.reduce(function(a,d){return a+d.montant;},0);
    var beneficeNet = caTotal - totalDep2;
    var totalDettes2 = DB.dettes.filter(function(d){return !d.paye;}).reduce(function(a,d){return a+d.montant;},0);
    var produitsBas = DB.produits.filter(function(p){
      var seuil = p.seuil==null ? 5 : p.seuil;
      return stockRestant(p) <= seuil;
    });
    var syncCfg = getSyncConfig();
    body =
      '<div class="row" style="gap:6px;margin-bottom:10px;">' +
        '<input type="month" value="'+resumePeriode+'" onchange="setResumePeriode(this.value)" style="flex:1;">' +
        '<button class="btn secondary small" onclick="setResumePeriode(\'\')">Tout</button>' +
      '</div>' +
      '<div class="metric-grid">' +
        '<div class="metric"><div class="lbl">CA total</div><div class="val">'+fmt(caTotal)+'</div></div>' +
        '<div class="metric"><div class="lbl">Dépenses</div><div class="val">'+fmt(totalDep2)+'</div></div>' +
        '<div class="metric" style="grid-column:1/3;"><div class="lbl">Bénéfice net</div><div class="val" style="color:'+(beneficeNet>=0?'var(--green)':'var(--danger)')+';">'+fmt(beneficeNet)+'</div></div>' +
        '<div class="metric" style="grid-column:1/3;"><div class="lbl">Dettes clients en cours</div><div class="val" style="color:var(--danger);">'+fmt(totalDettes2)+'</div></div>' +
      '</div>' +
      '<div class="meta" style="margin-bottom:8px;">Dettes clients = situation actuelle (non filtrée par période).</div>' +
      '<div class="card">' +
        '<div class="row"><span class="meta">CA soins</span><span>'+fmt(caSoins)+'</span></div>' +
        '<div class="row"><span class="meta">CA produits</span><span>'+fmt(caProduits)+'</span></div>' +
      '</div>' +
      (produitsBas.length ?
        '<div class="banner-note" style="background:#fbe0de;color:#8a241c;">&#9888; Stock bas : '+produitsBas.map(function(p){return escHtml(p.nom);}).join(', ')+'</div>'
        : '') +
      '<h3 class="sub-title">Sauvegarde des données</h3>' +
      '<div class="card">' +
        '<div class="meta" style="margin-bottom:8px;">Télécharge une copie de toutes tes données (catalogues, ventes, visites, factures, dépenses, dettes) — utile pour garder une sauvegarde ou transférer vers un autre téléphone.</div>' +
        '<button class="btn secondary block" onclick="exportData()">Exporter une sauvegarde (.json)</button>' +
        '<label style="margin-top:10px;">Restaurer depuis un fichier de sauvegarde</label>' +
        '<input type="file" accept="application/json" onchange="importDataFile(this)">' +
        '<div class="meta" style="margin-top:6px;">Attention : restaurer un fichier remplace toutes les données actuelles.</div>' +
      '</div>' +
      '<h3 class="sub-title">Synchronisation automatique (en ligne)</h3>' +
      '<div class="card">' +
        '<div class="meta" style="margin-bottom:8px;">Relie tablette et téléphone via un espace de stockage gratuit JSONBin.io. Crée un compte sur jsonbin.io, copie ta "Master Key", colle-la ici sur le 1er appareil (laisse "ID de synchro" vide, il se crée automatiquement), puis copie cet ID généré dans le 2ᵉ appareil.</div>' +
        '<label>Clé API JSONBin (Master Key)</label><input type="text" id="syncApiKey" value="'+escHtml(syncCfg.apiKey)+'" placeholder="Colle ta clé ici">' +
        '<label>ID de synchro (laisse vide sur le 1er appareil)</label><input type="text" id="syncBinId" value="'+escHtml(syncCfg.binId)+'" placeholder="Généré automatiquement">' +
        '<div class="row" style="margin-top:8px;"><label style="margin:0;">Activer la synchronisation automatique</label><input type="checkbox" id="syncEnabled" style="width:auto;" '+(syncCfg.enabled?'checked':'')+'></div>' +
        '<button class="btn block" onclick="setupSync()">Enregistrer la configuration</button>' +
        '<button class="btn secondary block" onclick="syncMaintenant()">Synchroniser maintenant</button>' +
        '<div class="meta" style="margin-top:6px;">La synchro se déclenche automatiquement après chaque saisie et toutes les 20 secondes environ. Le dernier appareil qui enregistre a la priorité.</div>' +
      '</div>';
  }

  el.innerHTML = '<h2 class="section-title">Finances</h2>' + subbar + body;
};

function exportData(){
  var payload = {
    exported_at: new Date().toISOString(),
    soins_catalogue: DB.soins,
    soins_journal: DB.journal,
    produits_catalogue: DB.produits,
    ventes_produits: DB.ventes,
    factures: DB.factures,
    depenses: DB.depenses,
    dettes_clients: DB.dettes,
    compteurs_numerotation: DB.compteurs,
    clients_repertoire: DB.clients
  };
  var blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'dallas_avenue_sauvegarde_' + todayISO() + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  showToast('Sauvegarde téléchargée');
}

function importDataFile(input){
  var file = input.files && input.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(e){
    try{
      var data = JSON.parse(e.target.result);
      if(!confirm('Cela va remplacer toutes les données actuelles par celles du fichier. Continuer ?')){ input.value=''; return; }
      DB.soins = data.soins_catalogue || [];
      DB.journal = data.soins_journal || [];
      DB.produits = data.produits_catalogue || [];
      DB.ventes = data.ventes_produits || [];
      DB.factures = data.factures || [];
      DB.depenses = data.depenses || [];
      DB.dettes = data.dettes_clients || [];
      DB.compteurs = data.compteurs_numerotation || DB.compteurs;
      DB.clients = data.clients_repertoire || [];
      saveKey(KEYS.soins, DB.soins);
      saveKey(KEYS.journal, DB.journal);
      saveKey(KEYS.produits, DB.produits);
      saveKey(KEYS.ventes, DB.ventes);
      saveKey(KEYS.factures, DB.factures);
      saveKey(KEYS.depenses, DB.depenses);
      saveKey(KEYS.dettes, DB.dettes);
      saveKey(KEYS.compteurs, DB.compteurs);
      saveKey(KEYS.clients, DB.clients);
      showToast('Données restaurées');
      renderers.finances();
    }catch(err){
      showToast('Fichier invalide');
    }
    input.value = '';
  };
  reader.readAsText(file);
}

function addDepense(){
  var date = document.getElementById('depDate').value || todayISO();
  var categorie = document.getElementById('depCat').value.trim();
  var detail = document.getElementById('depDetail').value.trim();
  var montant = parseFloat(document.getElementById('depMontant').value);
  if(!categorie || isNaN(montant)){ showToast('Catégorie et montant requis'); return; }
  DB.depenses.push({ id:uid(), date:date, categorie:categorie, detail:detail, montant:montant });
  saveKey(KEYS.depenses, DB.depenses);
  showToast('Dépense enregistrée');
  renderers.finances();
}
function deleteDepense(id){
  DB.depenses = DB.depenses.filter(function(d){return d.id!==id;});
  saveKey(KEYS.depenses, DB.depenses);
  renderers.finances();
}
function addDette(){
  var cliente = document.getElementById('dettCliente').value.trim();
  var date = document.getElementById('dettDate').value || todayISO();
  var montant = parseFloat(document.getElementById('dettMontant').value);
  var note = document.getElementById('dettNote').value.trim();
  if(!cliente || isNaN(montant)){ showToast('Nom et montant requis'); return; }
  DB.dettes.push({ id:uid(), cliente:cliente, date:date, montant:montant, note:note, paye:false });
  saveKey(KEYS.dettes, DB.dettes);
  showToast('Dette enregistrée');
  renderers.finances();
}
function marquerDettePayee(id){
  var d = DB.dettes.find(function(x){return x.id===id;});
  if(d) d.paye = true;
  saveKey(KEYS.dettes, DB.dettes);
  renderers.finances();
}
function deleteDette(id){
  DB.dettes = DB.dettes.filter(function(d){return d.id!==id;});
  saveKey(KEYS.dettes, DB.dettes);
  renderers.finances();
}
function setResumePeriode(v){ resumePeriode = v; renderers.finances(); }

/* ================= CLIENTS (répertoire réutilisable) ================= */
var editingClientId = null;

function clientsDatalistHtml(){
  return '<datalist id="clientsDatalist">' +
    DB.clients.map(function(c){ return '<option value="'+escHtml(c.nom)+'">'; }).join('') +
    '</datalist>';
}
function lookupClientPhone(nom){
  var c = DB.clients.find(function(x){return x.nom===nom;});
  return c ? c.telephone : '';
}

renderers.clients = function(){
  var el = document.getElementById('view-clients');
  var sorted = DB.clients.slice().sort(function(a,b){return a.nom.localeCompare(b.nom);});
  var list = sorted.map(function(c){
    return '<div class="item"><div>' +
      '<div class="name">'+escHtml(c.nom)+'</div>' +
      '<div class="meta">'+(c.telephone?escHtml(c.telephone):'')+(c.note?' &middot; '+escHtml(c.note):'')+'</div>' +
      '</div><div class="row" style="gap:6px;">' +
      '<button class="icon-btn" onclick="editClient(\''+c.id+'\')">&#9998;</button>' +
      '<button class="icon-btn danger" onclick="deleteClient(\''+c.id+'\')">&#128465;</button>' +
      '</div></div>';
  }).join('') || '<div class="empty">Aucun client enregistré.</div>';

  el.innerHTML =
    '<h2 class="section-title">Clients</h2>' +
    '<div class="banner-note">Ce répertoire est proposé automatiquement (nom + téléphone) quand tu remplis une facture, une visite ou une vente.</div>' +
    '<div class="card" id="clientFormCard">' +
      '<label>Nom</label><input type="text" id="clientNom" placeholder="Nom du client(e)">' +
      '<label>Téléphone</label><input type="text" id="clientTel" placeholder="71 74 74 15">' +
      '<label>Note (optionnel)</label><input type="text" id="clientNote" placeholder="Ex : cliente fidèle">' +
      '<button class="btn block" id="clientFormBtn" onclick="saveClient()">Ajouter au répertoire</button>' +
    '</div>' +
    '<h3 class="sub-title">Répertoire ('+sorted.length+')</h3>' + list;
};

function editClient(id){
  var c = DB.clients.find(function(x){return x.id===id;});
  if(!c) return;
  editingClientId = id;
  document.getElementById('clientNom').value = c.nom;
  document.getElementById('clientTel').value = c.telephone||'';
  document.getElementById('clientNote').value = c.note||'';
  document.getElementById('clientFormBtn').textContent = 'Enregistrer les modifications';
  document.getElementById('clientFormCard').scrollIntoView({behavior:'smooth'});
}
function saveClient(){
  var nom = document.getElementById('clientNom').value.trim();
  var telephone = document.getElementById('clientTel').value.trim();
  var note = document.getElementById('clientNote').value.trim();
  if(!nom){ showToast('Le nom est requis'); return; }
  if(editingClientId){
    var c = DB.clients.find(function(x){return x.id===editingClientId;});
    c.nom=nom; c.telephone=telephone; c.note=note;
    editingClientId = null;
  } else {
    DB.clients.push({ id:uid(), nom:nom, telephone:telephone, note:note });
  }
  saveKey(KEYS.clients, DB.clients);
  showToast('Répertoire mis à jour');
  renderers.clients();
}
function deleteClient(id){
  DB.clients = DB.clients.filter(function(c){return c.id!==id;});
  saveKey(KEYS.clients, DB.clients);
  renderers.clients();
}

/* ================= INIT ================= */
loadAll().then(function(){
  switchTab('soins');
  startSyncPolling();
});
</script>
