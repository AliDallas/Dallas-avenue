<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Dallas Avenue - Gestion</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Dallas Avenue">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
  :root{
    --gold:#c9a227;
    --gold-light:#f3e7c4;
    --black:#111111;
    --bg:#f7f5f0;
    --card:#ffffff;
    --border:#e3ddc9;
    --text:#1c1c1a;
    --muted:#7a766a;
    --danger:#a3352f;
    --green:#2f7d4f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding-bottom:76px;
  }
  .wrap{max-width:480px;margin:0 auto;padding:0 14px;}
  header.topbar{
    background:var(--black);
    color:var(--gold);
    padding:10px 14px 12px;
    display:flex;
    align-items:center;
    gap:10px;
    position:sticky;
    top:0;
    z-index:20;
  }
  header.topbar img{width:68px;height:68px;border-radius:50%;flex:none;}
  header.topbar .titles{line-height:1.2;min-width:0;}
  header.topbar .titles .t1{font-weight:800;font-size:clamp(20px,6.2vw,26px);letter-spacing:.06em;white-space:nowrap;}
  header.topbar .titles .t2{font-size:11px;color:#d8c98a;}
  h2.section-title{font-size:16px;margin:16px 0 10px;color:var(--black);}
  h3.sub-title{font-size:13px;margin:14px 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px 14px;
    margin-bottom:10px;
  }
  .row{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .row + .row{margin-top:4px;}
  label{display:block;font-size:12px;color:var(--muted);margin:8px 0 3px;}
  input,select,textarea{
    width:100%;
    padding:9px 10px;
    border:1px solid var(--border);
    border-radius:8px;
    font-size:14px;
    background:#fff;
    color:var(--text);
    font-family:inherit;
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);border-color:var(--gold);}
  .btn{
    display:inline-block;
    padding:10px 14px;
    border-radius:8px;
    border:1px solid var(--black);
    background:var(--black);
    color:var(--gold);
    font-size:14px;
    font-weight:600;
    text-align:center;
    cursor:pointer;
  }
  .btn.secondary{background:#fff;color:var(--black);border-color:var(--border);}
  .btn.danger{background:#fff;color:var(--danger);border-color:var(--danger);}
  .btn.block{width:100%;margin-top:10px;}
  .btn.small{padding:5px 9px;font-size:12px;}
  .pill{display:inline-block;padding:2px 8px;border-radius:20px;background:var(--gold-light);color:#5c4a10;font-size:11px;font-weight:600;}
  .pill.alert{background:#fbe0de;color:#8a241c;}
  .item{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);}
  .item:last-child{border-bottom:none;}
  .item .name{font-size:14px;font-weight:500;}
  .item .meta{font-size:12px;color:var(--muted);}
  .meta{font-size:12px;color:var(--muted);}
  .item .price{font-size:14px;font-weight:600;white-space:nowrap;}
  .cat-header{font-size:12px;font-weight:700;color:#8a6d0e;margin:12px 0 4px;text-transform:uppercase;letter-spacing:.03em;}
  .metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
  .metric{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px;}
  .metric .lbl{font-size:11px;color:var(--muted);margin-bottom:3px;}
  .metric .val{font-size:19px;font-weight:700;}
  table.mini{width:100%;border-collapse:collapse;font-size:12px;}
  table.mini th{text-align:left;color:var(--muted);font-weight:600;padding:5px 4px;border-bottom:1px solid var(--border);font-size:11px;}
  table.mini td{padding:6px 4px;border-bottom:1px solid var(--border);}
  table.mini tr:last-child td{border-bottom:none;}
  .empty{color:var(--muted);font-size:13px;padding:14px 0;text-align:center;}
  .icon-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;padding:4px 6px;}
  .icon-btn.danger{color:var(--danger);}
  nav.bottomnav{
    position:fixed;bottom:0;left:0;right:0;
    background:var(--black);
    display:flex;
    z-index:30;
    box-shadow:0 -2px 8px rgba(0,0,0,.15);
  }
  nav.bottomnav button{
    flex:1;background:none;border:none;color:#a99a5e;padding:9px 1px 8px;
    font-size:10px;font-family:inherit;cursor:pointer;
  }
  nav.bottomnav button .ic{display:block;font-size:17px;margin-bottom:2px;}
  @media(max-width:480px){nav.bottomnav button{font-size:9.5px;} nav.bottomnav button .ic{font-size:15px;}}
  nav.bottomnav button.active{color:var(--gold);}
  .plusmenu{position:fixed;bottom:64px;right:12px;display:flex;flex-direction:column;min-width:180px;background:var(--card,#fff);color:var(--text,#222);border:1px solid #ccc;border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.25);z-index:60;overflow:hidden;}
  .plusmenu[hidden]{display:none;}
  .plusmenu button{padding:14px 16px;background:none;border:0;border-bottom:1px solid #ddd;text-align:left;font-size:15px;color:inherit;}
  .plusmenu button:last-child{border-bottom:0;}
  .subtabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none;}
  .subtabs button{flex:1 0 auto;padding:9px 10px;white-space:nowrap;border-radius:8px;border:1px solid var(--border);background:#fff;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;font-family:inherit;}
  .subtabs button.active{background:var(--black);color:var(--gold);border-color:var(--black);}
  .view{display:none;}
  .view.active{display:block;padding-top:12px;}
  .facline{border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;}
  .toast{
    position:fixed;left:50%;bottom:90px;transform:translateX(-50%);
    background:var(--black);color:#fff;padding:9px 16px;border-radius:20px;
    font-size:13px;z-index:50;opacity:0;transition:opacity .25s;pointer-events:none;
  }
  .toast.show{opacity:1;}
  .banner-note{font-size:11px;color:var(--muted);background:var(--gold-light);border-radius:8px;padding:8px 10px;margin-bottom:10px;}
  .facture-summary{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:#fff;}

  .chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;scrollbar-width:none;}
  .chips button{flex:none;padding:7px 12px;border-radius:20px;border:1px solid var(--border);background:#fff;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;font-family:inherit;}
  .chips button.on{background:var(--black);color:var(--gold);border-color:var(--black);}
  details.pd summary{cursor:pointer;color:var(--muted);font-size:12.5px;margin-top:6px;}
  .qs{display:flex;gap:6px;align-items:center;margin-top:8px;}
  .qs input{flex:1;min-width:0;}
  .tile{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .tile .t1{font-weight:600;font-size:14px;}
  .tile .t2{font-size:12px;color:var(--muted);}
  .bar{height:8px;border-radius:4px;background:var(--gold-light);overflow:hidden;margin-top:4px;}
  .bar i{display:block;height:100%;background:var(--gold);}

  .lockscr{position:fixed;inset:0;background:#0a0a0a;z-index:200;color:#f3e7c4;display:flex;flex-direction:column;align-items:center;justify-content:safe center;overflow-y:auto;padding:20px;text-align:center;}
  .lockscr img{width:96px;height:96px;border-radius:50%;margin-bottom:10px;}
  .lockscr h1{margin:4px 0 2px;color:var(--gold);font-size:22px;letter-spacing:.08em;}
  .lockscr .sub{font-size:13px;opacity:.75;margin-bottom:14px;}
  .lockscr .dots{height:30px;font-size:26px;letter-spacing:8px;color:var(--gold);}
  .lockscr .lockusers{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 0 14px;max-width:420px;}
  .lockscr .lockuser{border:1px solid #3a3320;background:#17140c;color:#f3e7c4;border-radius:12px;padding:8px 12px;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;min-width:110px;}
  .lockscr .lockuser small{font-size:11px;font-weight:400;opacity:.7;margin-top:2px;}
  .lockscr .lockuser.on{border-color:#c9a227;background:#2a2410;color:#e6c65c;}
  .lockscr .lockinput{width:240px;max-width:80vw;text-align:center;font-size:28px;letter-spacing:10px;background:#17140c;border:1px solid #3a3320;color:#f3e7c4;border-radius:14px;padding:12px;margin:6px 0 10px;font-family:inherit;}
  .lockscr .msg{height:20px;font-size:13px;color:#ff8a80;margin-bottom:6px;}
  .lockscr .pad{display:grid;grid-template-columns:repeat(3,76px);gap:10px;}
  .lockscr .pad button{height:60px;border-radius:50%;border:1px solid #3a3320;background:#17140c;color:#f3e7c4;font-size:22px;font-family:inherit;cursor:pointer;}
  .lockscr .pad button:active{background:#2a2410;}
  .lockscr .pad .ok{background:var(--gold);color:#111;font-weight:700;font-size:16px;}
  .lockbtn{margin-left:auto;flex:none;font-size:18px !important;padding:8px 11px !important;background:#1c1810;border:1px solid #3a3320;color:var(--gold);border-radius:20px;padding:7px 11px;font-size:12px;font-family:inherit;cursor:pointer;white-space:nowrap;}
  body.locked .wrap, body.locked nav.bottomnav{visibility:hidden;}
  body.role-caisse nav.bottomnav button[data-tab="produits"],
  body.role-caisse nav.bottomnav button[data-tab="accueil"],
  body.role-caisse nav.bottomnav button[data-tab="finances"],
  body.role-caisse nav.bottomnav button[data-tab="sauvegarde"],
  body.role-caisse nav.bottomnav button[data-tab="plus"],
  body.role-caisse nav.bottomnav button[data-tab="clients"]{display:none;}
  body.role-caisse #view-soins .subtabs, body.role-caisse #view-produits .subtabs{display:none;}
  body.role-caisse .icon-btn.danger, body.role-caisse .btn.danger{display:none;}

  /* pavé numérique à l'écran */
  #numpad{position:fixed;left:0;right:0;bottom:0;z-index:300;background:#15130e;border-top:2px solid #c9a227;padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px));display:none;box-shadow:0 -8px 24px rgba(0,0,0,.35);}
  #numpad.show{display:block;}
  #numpad .np-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:420px;margin:0 auto;}
  #numpad button{height:56px;border-radius:12px;border:1px solid #3a3320;background:#221e12;color:#f3e7c4;font-size:22px;font-weight:600;font-family:inherit;touch-action:manipulation;-webkit-user-select:none;user-select:none;}
  #numpad button:active{background:#3a3320;}
  #numpad .np-ok{background:#c9a227;color:#111;font-weight:800;}
  #numpad .np-zero{grid-column:span 4;}
  #numpad .np-del{color:#ff8a80;}
  body.hasnumpad{padding-bottom:260px;}
</style>
</head>

  <button data-np="4">4</button><button data-np="5">5</button><button data-np="6">6</button><button data-np="." >.</button>
  <button data-np="7">7</button><button data-np="8">8</button><button data-np="9">9</button><button class="np-ok" data-np="ok">OK</button>
  <button class="np-zero" data-np="0">0</button>
</div></div>
<div id="lock" class="lockscr" style="display:none;"></div>

var syncPushTimer = null;
var lastKnownRemoteUpdatedAt = null;
var syncPollTimer = null;

function getSyncConfig(){
  try{
    return JSON.parse(localStorage.getItem('sync_config')) || {apiKey:'', binId:'', enabled:false};
  }catch(e){
    return {apiKey:'', binId:'', enabled:false};
  }
}
function saveSyncConfig(cfg){
  localStorage.setItem('sync_config', JSON.stringify(cfg));
}
function buildFullPayload(){
  return {
    updated_at: new Date().toISOString(),
    soins_catalogue: DB.soins,
    soins_journal: DB.journal,
    produits_catalogue: DB.produits,
    ventes_produits: DB.ventes,
    factures: DB.factures,
    depenses: DB.depenses,
    dettes_clients: DB.dettes,
    pertes: DB.pertes,
    fournisseurs: DB.fournisseurs,
    achats_fournisseurs: DB.achats,
    commandes_boutique: DB.commandes,
    utilisateurs: DB.utilisateurs,
    compteurs_numerotation: DB.compteurs,
    clients_repertoire: DB.clients
  };
}
function applyFullPayload(data){
  DB.soins = data.soins_catalogue || [];
  DB.journal = data.soins_journal || [];
  DB.produits = data.produits_catalogue || [];
  DB.ventes = data.ventes_produits || [];
  DB.factures = data.factures || [];
  DB.depenses = data.depenses || [];
  DB.dettes = data.dettes_clients || [];
  DB.pertes = data.pertes || [];
  DB.fournisseurs = data.fournisseurs || [];
  DB.achats = data.achats_fournisseurs || [];
  DB.commandes = data.commandes_boutique || [];
  if(data.utilisateurs && data.utilisateurs.length) DB.utilisateurs = data.utilisateurs;
  DB.compteurs = data.compteurs_numerotation || DB.compteurs;
  DB.clients = data.clients_repertoire || [];
  localStorage.setItem(KEYS.soins, JSON.stringify(DB.soins));
  localStorage.setItem(KEYS.journal, JSON.stringify(DB.journal));
  localStorage.setItem(KEYS.produits, JSON.stringify(DB.produits));
  localStorage.setItem(KEYS.ventes, JSON.stringify(DB.ventes));
  localStorage.setItem(KEYS.factures, JSON.stringify(DB.factures));
  localStorage.setItem(KEYS.depenses, JSON.stringify(DB.depenses));
  localStorage.setItem(KEYS.dettes, JSON.stringify(DB.dettes));
  localStorage.setItem(KEYS.pertes, JSON.stringify(DB.pertes));
  localStorage.setItem(KEYS.fournisseurs, JSON.stringify(DB.fournisseurs));
  localStorage.setItem(KEYS.achats, JSON.stringify(DB.achats));
  localStorage.setItem(KEYS.commandes, JSON.stringify(DB.commandes));
  localStorage.setItem(KEYS.utilisateurs, JSON.stringify(DB.utilisateurs));
  try{ revalidateSession(); }catch(e){}
  localStorage.setItem(KEYS.compteurs, JSON.stringify(DB.compteurs));
  localStorage.setItem(KEYS.clients, JSON.stringify(DB.clients));
}

async function cloudCreateBin(cfg){
  var res = await fetch('https://api.jsonbin.io/v3/b', {
    method:'POST',
    headers: { 'Content-Type':'application/json', 'X-Master-Key': cfg.apiKey, 'X-Bin-Name':'dallas_avenue_sync' },
    body: JSON.stringify(buildFullPayload())
  });
  if(!res.ok) throw new Error('create_failed');
  var json = await res.json();
  var id = json.metadata && json.metadata.id;
  if(!id) throw new Error('no_id');
  return id;
}
async function cloudPush(){
  var cfg = getSyncConfig();
  if(!cfg.apiKey || !cfg.binId) return;
  var payload = buildFullPayload();
  var res = await fetch('https://api.jsonbin.io/v3/b/'+cfg.binId, {
    method:'PUT',
    headers: { 'Content-Type':'application/json', 'X-Master-Key': cfg.apiKey },
    body: JSON.stringify(payload)
  });
  if(!res.ok) throw new Error('push_failed');
  lastKnownRemoteUpdatedAt = payload.updated_at;
}
async function cloudPull(){
  var cfg = getSyncConfig();
  if(!cfg.apiKey || !cfg.binId) return null;
  var res = await fetch('https://api.jsonbin.io/v3/b/'+cfg.binId+'/latest', {
    headers: { 'X-Master-Key': cfg.apiKey }
  });
  if(!res.ok) throw new Error('pull_failed');
  var json = await res.json();
  return json.record || json;
}
/* Hors ligne : chaque modification est marquée « en attente » et envoyée
   dès que la connexion revient (ou au prochain essai automatique). */
function marquerEnAttente(v){
  try{ localStorage.setItem('sync_pending', v ? '1' : '0'); }catch(e){}
}
function syncEnAttente(){
  try{ return localStorage.getItem('sync_pending') === '1'; }catch(e){ return false; }
}
function scheduleCloudPush(){
  var cfg = getSyncConfig();
  if(!cfg.enabled || !cfg.apiKey || !cfg.binId) return;
  marquerEnAttente(true);
  clearTimeout(syncPushTimer);
  syncPushTimer = setTimeout(envoyerEnAttente, 1500);
}
function envoyerEnAttente(){
  if(!syncEnAttente()) return;
  if(!navigator.onLine){ return; }
  cloudPush().then(function(){
    marquerEnAttente(false);
  }).catch(function(){
    clearTimeout(syncPushTimer);
    syncPushTimer = setTimeout(envoyerEnAttente, 30000);
  });
}
window.addEventListener('online', function(){
  showToast('Connexion retrouvée : synchronisation...');
  envoyerEnAttente();
});
window.addEventListener('offline', function(){
  showToast('Hors ligne : vos modifications seront envoyées au retour de la connexion');
});
async function setupSync(){
  var apiKey = document.getElementById('syncApiKey').value.trim();
  var binId = document.getElementById('syncBinId').value.trim();
  var enabled = document.getElementById('syncEnabled').checked;
  if(!apiKey){ showToast('Colle ta clé API JSONBin'); return; }
  var cfg = { apiKey:apiKey, binId:binId, enabled:enabled };
  showToast('Connexion en cours...');
  try{
    if(!cfg.binId){
      cfg.binId = await cloudCreateBin(cfg);
      saveSyncConfig(cfg);
      showToast('Espace de synchro créé : ' + cfg.binId);
    } else {
      saveSyncConfig(cfg);
      var remote = await cloudPull();
      if(remote){
        applyFullPayload(remote);
        lastKnownRemoteUpdatedAt = remote.updated_at;
      }
      showToast('Connecté - données récupérées depuis l\'autre appareil');
    }
    startSyncPolling();
    renderers.finances();
  }catch(e){
    showToast('Échec de connexion - vérifie la clé et l\'ID');
  }
}
async function syncMaintenant(){
  var cfg = getSyncConfig();
  if(!cfg.apiKey || !cfg.binId){ showToast('Configure d\'abord la synchronisation'); return; }
  showToast('Synchronisation...');
  try{
    if(syncEnAttente()){ await cloudPush(); marquerEnAttente(false); showToast('Synchronisé avec succès'); return; }
    var remote = await cloudPull();
    if(remote && remote.updated_at && remote.updated_at !== lastKnownRemoteUpdatedAt){
      applyFullPayload(remote);
      lastKnownRemoteUpdatedAt = remote.updated_at;
      renderCurrentView();
    }
    await cloudPush();
    showToast('Synchronisé avec succès');
  }catch(e){
    showToast('Synchronisation impossible - vérifie ta connexion');
  }
}
function startSyncPolling(){
  clearInterval(syncPollTimer);
  var cfg = getSyncConfig();
  if(!cfg.enabled || !cfg.apiKey || !cfg.binId) return;
  syncPollTimer = setInterval(function(){
    if(syncEnAttente()){ envoyerEnAttente(); return; } // ne jamais écraser des modifications locales non envoyées
    cloudPull().then(function(remote){
      if(remote && remote.updated_at && remote.updated_at !== lastKnownRemoteUpdatedAt){
        applyFullPayload(remote);
        lastKnownRemoteUpdatedAt = remote.updated_at;
        renderCurrentView();
        showToast('Données mises à jour (autre appareil)');
      }
    }).catch(function(){});
  }, 20000);
}

      if(m){ var n=parseInt(m[2],10); if(m[1]==='FP') maxFP=Math.max(maxFP,n); else maxFS=Math.max(maxFS,n); }
    });

function peekNumero(type){
  var n = (DB.compteurs[type]||0) + 1;
  var prefix = type==='factureProduit' ? 'FP-' : type==='factureSoin' ? 'FS-' : 'V-';
  return prefix + String(n).padStart(4,'0');
}
function consumeNumero(type){
  DB.compteurs[type] = (DB.compteurs[type]||0) + 1;
  saveKey(KEYS.compteurs, DB.compteurs);
  var prefix = type==='factureProduit' ? 'FP-' : type==='factureSoin' ? 'FS-' : 'V-';
  return prefix + String(DB.compteurs[type]).padStart(4,'0');
}
function inPeriode(dateStr, periode){
  if(!periode) return true;
  return !!dateStr && dateStr.slice(0,7)===periode;
}

function produitCalc(p){
  var coutTransport = p.prixAchat * p.pct;
  var achatTotal = p.prixAchat + coutTransport;
  var marge = p.prixVente - achatTotal;
  var margePct = achatTotal ? (marge/achatTotal) : 0;
  return { coutTransport:coutTransport, achatTotal:achatTotal, marge:marge, margePct:margePct };
}
function stockVendu(produitId){
  return DB.ventes.filter(function(v){return v.produitId===produitId;}).reduce(function(a,v){return a+v.qte;},0);
}
function stockPerdu(produitId){
  return (DB.pertes||[]).filter(function(x){return x.produitId===produitId;}).reduce(function(a,x){return a+x.qte;},0);
}
function stockRestant(p){
  return p.stock - stockVendu(p.id) - stockPerdu(p.id);
}

  (function(){ var sel=document.getElementById('prodCat'); var v=p.categorie||''; if(v && !Array.prototype.some.call(sel.options,function(o){return o.value===v;})){ var o=document.createElement('option'); o.value=v; o.textContent=v; sel.insertBefore(o, sel.lastElementChild); } sel.value=v; })();

function handleProdPhoto(input){
  var file = input.files && input.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(e){
    var img = new Image();
    img.onload = function(){
      var maxDim = 640;
      var scale = Math.min(1, maxDim/Math.max(img.width, img.height));
      var cw = Math.round(img.width*scale), ch = Math.round(img.height*scale);
      var canvas = document.createElement('canvas');
      canvas.width = cw; canvas.height = ch;
      canvas.getContext('2d').drawImage(img, 0, 0, cw, ch);
      var dataUrl = canvas.toDataURL('image/jpeg', 0.7);
      prodPhotoTemp = dataUrl;
      var prev = document.getElementById('prodPhotoPreview');
      if(prev) prev.innerHTML = '<img src="'+dataUrl+'" style="width:100%;max-width:180px;border-radius:8px;margin-top:8px;display:block;">';
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
function saveProduit(){ if(!isAdmin()){ showToast('Réservé aux administrateurs'); return; }
  var nom = document.getElementById('prodNom').value.trim();
  var achat = parseFloat(document.getElementById('prodAchat').value);
  var pct = parseFloat(document.getElementById('prodPct').value);
  var vente = parseFloat(document.getElementById('prodVente').value);
  var stock = parseFloat(document.getElementById('prodStock').value);
  var seuilRaw = document.getElementById('prodSeuil').value;
  var seuil = seuilRaw==='' ? 5 : (parseFloat(seuilRaw)||0);
  if(!nom || isNaN(achat) || isNaN(pct) || isNaN(vente) || isNaN(stock)){ showToast('Remplis tous les champs'); return; }
  var categorie = document.getElementById('prodCat').value.trim();
  var description = document.getElementById('prodDesc').value.trim();
  var badge = document.getElementById('prodBadge').value;
  var tailles = document.getElementById('prodTailles').value.trim();
  var couleurs = document.getElementById('prodCouleurs').value.trim();
  var prixBarre = parseFloat(document.getElementById('prodPrixBarre').value) || 0;
  if(editingProduitId){
    var p = DB.produits.find(function(x){return x.id===editingProduitId;});
    p.nom=nom; p.prixAchat=achat; p.pct=pct/100; p.prixVente=vente; p.stock=stock; p.seuil=seuil;
    p.categorie=categorie; p.description=description; p.badge=badge; p.tailles=tailles; p.couleurs=couleurs; p.prixBarre=prixBarre;
    if(prodPhotoTemp) p.photo = prodPhotoTemp;
    editingProduitId = null;
  } else {
    DB.produits.push({ id:uid(), nom:nom, prixAchat:achat, pct:pct/100, prixVente:vente, stock:stock, seuil:seuil, categorie:categorie, description:description, badge:badge, tailles:tailles, couleurs:couleurs, prixBarre:prixBarre, photo:prodPhotoTemp||null });
  }
  prodPhotoTemp = null;
  saveKey(KEYS.produits, DB.produits);
  showToast('Catalogue mis à jour');
  renderers.produits();
}
function deleteProduit(id){ if(!isAdmin()){ showToast('Réservé aux administrateurs'); return; }
  DB.produits = DB.produits.filter(function(p){return p.id!==id;});
  saveKey(KEYS.produits, DB.produits);
  renderers.produits();
}

/* ===== pavé numérique à l'écran ===== */
var npTarget = null;
function npShow(inp){
  npTarget = inp;
  var pad = document.getElementById('numpad'); if(!pad) return;
  pad.classList.add('show'); document.body.classList.add('hasnumpad');
  inp.setAttribute('inputmode','none');
  setTimeout(function(){ try{ inp.scrollIntoView({block:'center'}); }catch(e){} }, 50);
}
function npHide(){
  var pad = document.getElementById('numpad'); if(pad) pad.classList.remove('show');
  document.body.classList.remove('hasnumpad');
  if(npTarget){ npTarget.dispatchEvent(new Event('change',{bubbles:true})); npTarget.blur(); }
  npTarget = null;
}
function npPress(k){
  var t = npTarget; if(!t) return;
  var v = String(t.value||'');
  if(k==='ok'){ npHide(); return; }
  if(k==='del'){ v = v.slice(0,-1); }
  else if(k==='.'){ if(v.indexOf('.')<0) v = (v===''?'0':v)+'.'; }
  else { if(v.length<12) v += k; }
  t.value = v;
  t.dispatchEvent(new Event('input',{bubbles:true}));
}
document.addEventListener('focusin', function(e){
  var t = e.target;
  if(t && t.tagName==='INPUT' && t.getAttribute('data-pad')==='1'){ npShow(t); }
});
document.addEventListener('pointerdown', function(e){
  var b = e.target.closest ? e.target.closest('#numpad button') : null;
  if(b){ e.preventDefault(); npPress(b.getAttribute('data-np')); return; }
  var inp = e.target.closest ? e.target.closest('input[data-pad="1"]') : null;
  if(inp){ npShow(inp); return; }
  if(npTarget && !(e.target.closest && e.target.closest('#numpad'))) npHide();
}, true);

  var qte = parseFloat(document.getElementById('caisseQte').value);

  if(!qte || qte<=0){ showToast('Quantité invalide'); return; }
  var p = DB.produits.find(function(x){return x.id===id;}); if(!p) return;
  var dejaDansPanier = caisseLignes.filter(function(l){return l.id===id;}).reduce(function(a,l){return a+l.qte;},0);
  if(dejaDansPanier + qte > stockRestant(p)){ showToast('Stock insuffisant : il reste '+stockRestant(p)+' '+p.nom); return; }
  var ligne = caisseLignes.find(function(l){return l.id===id;});
  if(ligne) ligne.qte += qte; else caisseLignes.push({ id:p.id, nom:p.nom, prix:p.prixVente, qte:qte });
  renderers.produits();
}
function removeLigneCaisse(i){ caisseLignes.splice(i,1); renderers.produits(); }
function validerCaisse(format){
  if(!caisseLignes.length){ showToast('Le panier est vide'); return; }
  for(var i=0;i<caisseLignes.length;i++){
    var l = caisseLignes[i], p = DB.produits.find(function(x){return x.id===l.id;});
    if(!p || l.qte > stockRestant(p)){ showToast('Stock insuffisant pour '+l.nom); return; }
  }
  var sous = caisseLignes.reduce(function(a,l){ return a+l.prix*l.qte; },0);
  var remise = Math.min(caisseMeta.remise||0, sous);
  var numero = consumeNumero('factureProduit');
  var facture = {
    id:uid(), type:'produit', numero:numero, date:todayISO(),
    client:(caisseMeta.client||'').trim(), tel:(caisseMeta.tel||'').trim(),
    lignes:caisseLignes.map(function(l){ return { designation:l.nom, prix:l.prix, qte:l.qte, total:l.prix*l.qte, refId:l.id }; }),
    remise:remise, total:sous-remise
  };
  DB.factures.push(facture);
  saveKey(KEYS.factures, DB.factures);
  facturerVersVentes(facture, sous);   // enregistre les ventes et déduit le stock
  caisseLignes = [];
  caisseMeta = { client:'', tel:'', remise:0 };
  derniereFactureId = facture.id;
  showToast('Vente enregistrée ('+numero+')');
  renderers.produits();
  if(format) imprimerFacture(facture.id, format);
}

function addLigneFacture(){
  var idx = document.getElementById('facDesignation').value;
  var qte = parseFloat(document.getElementById('facQte').value);
  if(idx===''){ showToast('Choisis un élément'); return; }
  if(!qte || qte<=0){ showToast('Quantité invalide'); return; }
  var c = window.__facSource[parseInt(idx,10)];
  nouvelleFactureLignes.push({ designation:c.nom, prix:c.prix, qte:qte, total:c.prix*qte, refId:c.id });
  renderers.factures();
}
function removeLigneFacture(idx){
  nouvelleFactureLignes.splice(idx,1);
  renderers.factures();
}
function saveFacture(){
  if(!nouvelleFactureLignes.length){ showToast('Ajoute au moins une ligne'); return; }
  var numero = consumeNumero(facturesSub==='soin' ? 'factureSoin' : 'factureProduit');
  var date = document.getElementById('facDate').value || todayISO();
  var client = document.getElementById('facClient').value.trim();
  var tel = document.getElementById('facTel').value.trim();
  var remise = nouvelleFactureMeta.remise || 0;
  var sousTotal = nouvelleFactureLignes.reduce(function(a,l){return a+l.total;},0);
  var facture = { id:uid(), type:facturesSub, numero:numero, date:date, client:client, tel:tel, lignes:nouvelleFactureLignes, remise:remise, total:sousTotal-remise };
  DB.factures.push(facture);
  saveKey(KEYS.factures, DB.factures);
  if(facLie) facturerVersVentes(facture, sousTotal);
  nouvelleFactureLignes = [];
  nouvelleFactureMeta = { numero:null, date:null, client:'', tel:'', remise:0 };
  showToast('Facture enregistrée ('+numero+')');
  renderers.factures();
}
function facturerVersVentes(f, sousTotal){
  var ratio = sousTotal > 0 ? (sousTotal - (f.remise||0)) / sousTotal : 1;
  if(f.type==='soin'){
    f.lignes.forEach(function(l){
      var soin = DB.soins.find(function(x){return x.id===l.refId;});
      for(var k=0;k<l.qte;k++){
        DB.journal.push({ id:uid(), date:f.date, cliente:f.client, soinId:l.refId, soinNom:l.designation, prix:Math.round(l.prix*ratio), employe:'', facture:f.numero });
      }
    });
    saveKey(KEYS.journal, DB.journal);
  } else {
    f.lignes.forEach(function(l){
      var pr = DB.produits.find(function(x){return x.id===l.refId;}); if(!pr) return;
      var c = produitCalc(pr), total = Math.round(l.total*ratio), numero = consumeNumero('vente');
      DB.ventes.push({ id:uid(), numero:numero, date:f.date, produitId:pr.id, produitNom:pr.nom, prixVente:total/l.qte, coutUnitaire:c.achatTotal,
        margeUnitaire:total/l.qte - c.achatTotal, qte:l.qte, total:total, marge:total - l.qte*c.achatTotal, client:f.client, facture:f.numero });
    });
    saveKey(KEYS.ventes, DB.ventes);
  }
}
function deleteFacture(id){ if(!isAdmin()){ showToast('Réservé aux administrateurs'); return; }
  var fac = DB.factures.find(function(f){return f.id===id;});
  if(fac){
    var avant = DB.ventes.length + DB.journal.length;
    DB.ventes = DB.ventes.filter(function(v){return v.facture!==fac.numero;});
    DB.journal = DB.journal.filter(function(j){return j.facture!==fac.numero;});
    if(DB.ventes.length + DB.journal.length !== avant){ saveKey(KEYS.ventes, DB.ventes); saveKey(KEYS.journal, DB.journal); }
  }
  DB.factures = DB.factures.filter(function(f){return f.id!==id;});
  saveKey(KEYS.factures, DB.factures);
  renderers.factures();
}

function truncateText(s, n){ s = String(s||''); return s.length>n ? s.slice(0,n-1)+'…' : s; }
function formatDateFr(iso){
  if(!iso) return '';
  var p = iso.split('-');

function loadImagePromise(src){
  return new Promise(function(resolve, reject){
    var img = new Image();
    img.onload = function(){ resolve(img); };
    img.onerror = reject;
    img.src = src;
  });
}
async function buildFactureCanvas(f){
  var W = 800;
  var lineH = 34;
  var headerH = 170;
  var metaH = 92;
  var tableHeaderH = 40;
  var linesH = Math.max(1, f.lignes.length) * lineH;
  var totalsH = f.remise ? 150 : 120;
  var footerH = 140;
  var H = headerH + metaH + tableHeaderH + linesH + totalsH + footerH;

  var canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  var ctx = canvas.getContext('2d');

  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0,0,W,H);

  ctx.fillStyle = '#111111';
  ctx.fillRect(0,0,W,headerH);

  try{
    var logoImg = await loadImagePromise('data:image/jpeg;base64,'+LOGO_INVOICE_B64);
    var logoSize = 110;
    ctx.drawImage(logoImg, 30, (headerH-logoSize)/2, logoSize, logoSize);
  }catch(e){}

  var textX = 30+110+20;
  var padTop = 42;
  ctx.fillStyle = '#c9a227';
  ctx.font = 'bold 30px sans-serif';
  ctx.fillText('DALLAS AVENUE', textX, padTop);
  ctx.font = '13px sans-serif';
  ctx.fillStyle = '#d8c98a';
  ctx.fillText('Institut de beauté & vente de produits bien-être', textX, padTop+26);
  ctx.font = '12px sans-serif';
  ctx.fillStyle = '#a99a5e';
  ctx.fillText('Nioro du Sahel, Koulouba', textX, padTop+46);
  ctx.fillText('Tél : 71 74 74 15', textX, padTop+64);

  ctx.textAlign = 'right';
  ctx.fillStyle = '#c9a227';
  ctx.font = 'bold 22px sans-serif';
  ctx.fillText('FACTURE', W-30, headerH/2 - 10);
  ctx.font = '16px sans-serif';
  ctx.fillStyle = '#ffffff';
  ctx.fillText(f.numero, W-30, headerH/2 + 16);
  ctx.textAlign = 'left';

  var y = headerH + 38;
  ctx.fillStyle = '#111111';
  ctx.font = 'bold 15px sans-serif';
  ctx.fillText('Date : ' + formatDateFr(f.date), 30, y);
  ctx.fillText('Client : ' + (f.client||'-'), 30, y+26);
  if(f.tel){ ctx.fillText('Téléphone : ' + f.tel, 30, y+52); }

  y = headerH + metaH;
  ctx.fillStyle = '#f3e7c4';
  ctx.fillRect(30, y, W-60, tableHeaderH);
  ctx.fillStyle = '#111111';
  ctx.font = 'bold 14px sans-serif';
  ctx.fillText('DÉSIGNATION', 45, y+26);
  ctx.fillText('QTÉ', W-330, y+26);
  ctx.fillText('PRIX U.', W-235, y+26);
  ctx.fillText('TOTAL', W-115, y+26);
  y += tableHeaderH;

  ctx.font = '14px sans-serif';
  f.lignes.forEach(function(l, i){
    ctx.fillStyle = i%2===0 ? '#ffffff' : '#faf8f2';
    ctx.fillRect(30, y, W-60, lineH);
    ctx.fillStyle = '#111111';
    ctx.fillText(truncateText(l.designation, 32), 45, y+22);
    ctx.fillText(String(l.qte), W-330, y+22);
    ctx.fillText(fmt(l.prix), W-235, y+22);
    ctx.fillText(fmt(l.total), W-115, y+22);
    y += lineH;
  });

  y += 24;
  ctx.textAlign = 'right';
  ctx.font = '15px sans-serif';
  ctx.fillStyle = '#111111';
  ctx.fillText('Sous-total : ' + fmt(f.total+f.remise), W-30, y); y += 26;
  if(f.remise){ ctx.fillText('Remise : -' + fmt(f.remise), W-30, y); y += 26; }
  ctx.font = 'bold 24px sans-serif';
  ctx.fillText('TOTAL : ' + fmt(f.total), W-30, y); y += 44;
  ctx.textAlign = 'left';

  ctx.strokeStyle = '#e3ddc9';
  ctx.beginPath(); ctx.moveTo(30,y); ctx.lineTo(W-30,y); ctx.stroke();
  y += 32;
  ctx.textAlign = 'center';
  ctx.font = 'bold 14px sans-serif';
  ctx.fillStyle = '#8a6d0e';
  ctx.fillText('BEAUTÉ  •  CONFIANCE  •  ATTITUDE', W/2, y);
  y += 24;
  ctx.font = '12px sans-serif';
  ctx.fillStyle = '#7a766a';
  ctx.fillText('Tél : 71 74 74 15   •   TikTok : Dallas Avenue', W/2, y);
  y += 26;
  ctx.font = 'italic 13px sans-serif';
  ctx.fillText('Merci de votre confiance - Dallas Avenue', W/2, y);
  ctx.textAlign = 'left';

  return canvas;
}
async function partagerFacture(id){
  var f = DB.factures.find(function(x){return x.id===id;});
  if(!f) return;
  showToast('Préparation de la facture...');
  var canvas;
  try{
    canvas = await buildFactureCanvas(f);
  }catch(e){
    showToast('Erreur lors de la génération');
    return;
  }
  canvas.toBlob(async function(blob){
    if(!blob){ showToast('Erreur de génération'); return; }
    var file = new File([blob], 'facture_'+f.numero+'.png', {type:'image/png'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{
        await navigator.share({ files:[file], title:'Facture '+f.numero, text:'Facture Dallas Avenue '+f.numero });
        return;
      }catch(e){
        return;
      }
    }
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'facture_'+f.numero+'.png';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    showToast('Image téléchargée - à partager depuis ta galerie');
  }, 'image/png');
}

function etiquettesHtml(){
  var opts = DB.produits.map(function(p){ return '<option value="'+p.id+'">'+escHtml(p.nom)+' ('+fmt(p.prixVente)+')</option>'; }).join('');
  var lignes = etiqSel.length ? etiqSel.map(function(x,i){
    var p = DB.produits.find(function(y){return y.id===x.id;});
    return '<div class="item"><div><div class="name">'+escHtml(p?p.nom:'Produit supprimé')+'</div><div class="meta">'+fmt(p?p.prixVente:0)+'</div></div>' +
      '<div class="row" style="gap:6px;"><input type="text" inputmode="none" data-pad="1" value="'+x.qte+'" style="width:70px;" onchange="etiqSetQte('+i+',this.value)">' +
      '<button class="icon-btn danger" onclick="etiqRemove('+i+')">&#128465;</button></div></div>';
  }).join('') : '<div class="empty">Aucun produit choisi.</div>';
  var total = etiqSel.reduce(function(a,x){return a + (parseInt(x.qte,10)||0);},0);
  var pages = Math.max(1, Math.ceil(total / (ETIQ.cols*ETIQ.rows)));
  return '<div class="row" style="margin-bottom:10px;"><button class="btn secondary small" onclick="setProduitsSub(\'ventes\')">&larr; Retour aux ventes</button></div>' +
    '<h2 class="section-title">Étiquettes de rayon</h2>' +
    '<div class="card"><label>Produit</label><select id="etiqProd">'+opts+'</select>' +
      '<label>Nombre d\'étiquettes</label><input type="text" inputmode="none" data-pad="1" id="etiqQte" value="1">' +
      '<button class="btn block" style="margin-top:10px;" onclick="etiqAdd()">Ajouter</button></div>' +
    '<h3 class="sub-title">Choix</h3>' + lignes +
    '<div class="meta" style="margin:10px 0;">'+total+' étiquette(s), soit '+pages+' feuille(s) A4 de '+(ETIQ.cols*ETIQ.rows)+' étiquettes.</div>' +
    '<button class="btn block" onclick="etiqPrint()" '+(total?'':'disabled')+'>Imprimer les étiquettes</button>' +
    (etiqSel.length?'<button class="btn secondary block" style="margin-top:8px;" onclick="etiqVider()">Vider la liste</button>':'');
}
function etiqAdd(){
  var id = document.getElementById('etiqProd').value;
  var q = parseInt(document.getElementById('etiqQte').value,10);
  if(!q || q<1){ showToast('Indique un nombre d\'étiquettes'); return; }
  var ex = etiqSel.find(function(x){return x.id===id;});
  if(ex) ex.qte = (parseInt(ex.qte,10)||0) + q; else etiqSel.push({id:id, qte:q});
  renderers.produits();
}
function etiqRemove(i){ etiqSel.splice(i,1); renderers.produits(); }
function etiqSetQte(i,v){ var q=parseInt(v,10); if(q>0) etiqSel[i].qte=q; else etiqSel.splice(i,1); renderers.produits(); }
function etiqVider(){ etiqSel = []; renderers.produits(); }
function etiqPrint(){
  var labels = [];
  etiqSel.forEach(function(x){
    var p = DB.produits.find(function(y){return y.id===x.id;});
    if(!p) return;
    for(var k=0;k<(parseInt(x.qte,10)||0);k++) labels.push(p);
  });
  if(!labels.length){ showToast('Choisis au moins un produit'); return; }
  var per = ETIQ.cols*ETIQ.rows, pagesHtml = '';
  var logo = ((document.querySelector('header.topbar img')||{}).src) || '';
  for(var pg=0; pg*per < labels.length; pg++){
    var cells = '';
    for(var c=0;c<per;c++){
      var lab = labels[pg*per+c];
      var nomL = lab ? lab.nom : '';
      var prixL = lab ? Math.round(lab.prixVente||0).toLocaleString('fr-FR') + ' FCFA' : '';
      var tailleN = nomL.length > 22 ? '9pt' : '11pt';
      cells += '<div class="e">' + (lab ? '<div class="ln" style="font-size:'+tailleN+'">'+escHtml(nomL)+'</div><div class="lp">'+escHtml(prixL)+'</div>' : '') + '</div>';
    }
    pagesHtml += '<div class="sheet">'+cells+'</div>';
  }
  var css = '@page{size:A4;margin:0}' +
    'body{margin:0;font-family:Arial,sans-serif;color:#000}' +
    '.sheet{width:210mm;height:297mm;padding:'+ETIQ.marginTop+'mm 0 0 '+ETIQ.marginLeft+'mm;box-sizing:border-box;display:grid;grid-template-columns:repeat('+ETIQ.cols+','+ETIQ.w+'mm);grid-auto-rows:'+ETIQ.h+'mm;page-break-after:always;}' +
    '.e{position:relative;width:'+ETIQ.w+'mm;height:'+ETIQ.h+'mm;box-sizing:border-box;background-image:url("'+ETIQ_BG+'");background-size:100% 100%;background-repeat:no-repeat;overflow:hidden;}' +
    '.ln,.lp{position:absolute;left:4.5%;width:91%;display:flex;align-items:center;justify-content:center;color:#fff;white-space:nowrap;overflow:hidden;}' +

function listeVirgules(t){ return String(t||'').split(',').map(function(x){return x.trim();}).filter(Boolean); }
function variantesProduit(p){
  var out = [], t = listeVirgules(p.tailles), c = listeVirgules(p.couleurs);
  if(t.length) out.push({label: /ml|g$|cl|format/i.test(t.join(' ')) ? 'Format' : 'Taille', valeurs: t});
  if(c.length) out.push({label:'Couleur', valeurs: c});
  return out;
}
function categoriesProduits(){
  var seen = {}, out = [];
  DB.produits.forEach(function(p){ var c=(p.categorie||'').trim(); if(c && !seen[c.toLowerCase()]){ seen[c.toLowerCase()]=1; out.push(c); } });
  return out;
}
/* ================= CATÉGORIES DE PRODUITS (liste déroulante) ================= */
var CATS_SUGGEREES = ['Soins & crèmes','Parfums','Lingerie','Secrets de femme','Bijoux & accessoires','Chaussures','Tisanes & miel','Bonbons aphrodisiaques','Coffrets cadeaux','Divers'];
function listeCategories(){
  var seen = {}, out = [];
  CATS_SUGGEREES.concat(categoriesProduits()).forEach(function(c){
    c = String(c||'').trim(); if(c && !seen[c.toLowerCase()]){ seen[c.toLowerCase()]=1; out.push(c); }
  });
  return out;
}
function selectCategorie(id, valeur, onchangeJs){
  var v = String(valeur||'').trim();
  var opts = '<option value="">— Hors ligne (pas en vente en ligne) —</option>';
  listeCategories().forEach(function(c){
    opts += '<option value="'+escHtml(c)+'"'+(c===v?' selected':'')+'>'+escHtml(c)+'</option>';
  });
  if(v && listeCategories().indexOf(v)<0) opts += '<option value="'+escHtml(v)+'" selected>'+escHtml(v)+'</option>';
  opts += '<option value="__new__">+ Nouvelle catégorie…</option>';
  return '<select '+(id?'id="'+id+'" ':'')+'onchange="'+onchangeJs+'">'+opts+'</select>';
}
function gererNouvelleCatForm(sel){
  if(sel.value!=='__new__') return;
  var c = nouvelleCategorie(); if(!c){ sel.value=''; return; }
  var o = document.createElement('option'); o.value=c; o.textContent=c; o.selected=true;
  sel.insertBefore(o, sel.lastElementChild); sel.value=c;
}
function nouvelleCategorie(){
  var c = (prompt('Nom de la nouvelle catégorie :')||'').trim();
  return c;
}

function reduirePhoto(dataUrl, max){
  return new Promise(function(resolve){
    if(!dataUrl){ resolve(null); return; }
    var img = new Image();
    img.onload = function(){
      var r = Math.min(1, max/Math.max(img.width, img.height));
      var c = document.createElement('canvas');
      c.width = Math.round(img.width*r); c.height = Math.round(img.height*r);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      resolve(c.toDataURL('image/jpeg', 0.7));
    };
    img.onerror = function(){ resolve(null); };
    img.src = dataUrl;
  });
}
function ghConfig(){
  var t='',r='';
  try{ t=localStorage.getItem('da_gh_token')||''; r=localStorage.getItem('da_gh_repo')||''; }catch(e){}
  return {token:t, repo:r||'NIORO762/NIORO762.github.io'};
}
function ghSave(){
  var r=(document.getElementById('ghRepo').value||'').trim(), t=(document.getElementById('ghToken').value||'').trim();
  try{
    if(r) localStorage.setItem('da_gh_repo', r);
    if(t) localStorage.setItem('da_gh_token', t);
  }catch(e){ showToast('Enregistrement impossible'); return; }
  showToast('Réglages enregistrés'); renderers.produits && renderers.produits();
}
function ghClear(){ try{ localStorage.removeItem('da_gh_token'); }catch(e){} showToast('Clé retirée'); renderers.produits && renderers.produits(); }
async function ghPublish(txt){
  var c=ghConfig(), api='https://api.github.com/repos/'+c.repo+'/contents/boutique.json';
  var h={'Authorization':'Bearer '+c.token,'Accept':'application/vnd.github+json'};
  var sha=null, g=await fetch(api,{headers:h});
  if(g.status===200){ sha=(await g.json()).sha; }
  else if(g.status!==404){ throw new Error(g.status===401?'clé refusée':'GitHub '+g.status); }
  var body={message:'Mise à jour de la boutique',content:btoa(unescape(encodeURIComponent(txt)))};
  if(sha) body.sha=sha;
  var r=await fetch(api,{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},h),body:JSON.stringify(body)});
  if(!r.ok){ throw new Error(r.status===401||r.status===403?'clé sans droit d\'écriture':'GitHub '+r.status); }
}
async function publierBoutique(){ if(!isAdmin()){ showToast('Réservé aux administrateurs'); return; }
  if(!DB.produits.length){ showToast('Aucun produit à publier'); return; }
  showToast('Préparation de la boutique...');
  var items = [];
  var pub = DB.produits.filter(function(x){ return x.categorie && String(x.categorie).trim(); });
  if(!pub.length){ showToast('Aucun produit avec une catégorie : rien à publier'); return; }
  for(var i=0;i<pub.length;i++){
    var p = pub[i];
    items.push({
      id: p.id,
      nom: p.nom,
      prix: p.prixVente,
      categorie: p.categorie || '',
      description: p.description || '',
      badge: p.badge || '',
      variantes: variantesProduit(p),
      prixBarre: (p.prixBarre && p.prixBarre > p.prixVente) ? p.prixBarre : 0,
      reste: (stockRestant(p) > 0 && stockRestant(p) <= 3) ? stockRestant(p) : 0,
      dispo: stockRestant(p) > 0,
      photo: await reduirePhoto(p.photo, 560)
    });
  }
  var payload = { maj: new Date().toISOString(), whatsapp: '22371747415', produits: items };
  var txt = JSON.stringify(payload);
  if(ghConfig().token){
    try{ await ghPublish(txt); try{localStorage.setItem('da_last_pub', new Date().toISOString());}catch(e){} showToast('Boutique mise à jour en ligne ✓ (1 minute environ)'); return; }
    catch(e){ showToast('Échec : '+e.message+' - fichier téléchargé à la place'); }
  }
  var blob = new Blob([txt], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = 'boutique.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  showToast('boutique.json prêt - à envoyer sur GitHub');
}

function importDataFile(input){
  var file = input.files && input.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(e){
    try{

/* ================= PRODUITS : filtre, tri, stock ================= */
function norm(t){ return String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim(); }
function produitsVisibles(){
  var q = norm(prodQ);
  var arr = DB.produits.filter(function(p){
    if(q && norm(p.nom+' '+(p.categorie||'')).indexOf(q)<0) return false;
    var r = stockRestant(p);
    if(prodFiltre==='bas') return r>0 && r <= (p.seuil==null?5:p.seuil);
    if(prodFiltre==='epuise') return r<=0;
    if(prodFiltre==='promo') return p.prixBarre && p.prixBarre>p.prixVente;
    if(prodFiltre==='sansphoto') return !p.photo;
    return true;
  });
  arr.sort(function(a,b){
    if(prodTri==='stock') return stockRestant(a)-stockRestant(b);
    if(prodTri==='marge') return produitCalc(b).margePct-produitCalc(a).margePct;
    if(prodTri==='ventes') return stockVendu(b.id)-stockVendu(a.id);
    return a.nom.localeCompare(b.nom);
  });
  return arr;
}

/* ================= COMMANDES DE LA BOUTIQUE (WhatsApp) ================= */
function parseMoney(t){ return parseInt(String(t).replace(/[^\d]/g,''),10)||0; }
function analyserCommande(txt){
  var res = { num:'', client:'', tel:'', mode:'', lignes:[], total:0, note:'' };
  var m;
  (txt.match(/[^\n]+/g)||[]).forEach(function(raw){
    var l = raw.trim();
    if((m = /N[°o]\s*(DA-\d{4}-\d{4})/i.exec(l))) res.num = m[1];
    else if((m = /^[-•*]\s*(.+?)\s+x\s*(\d+)\s*=\s*([\d\s\u202f\u00a0.]+)\s*F/i.exec(l))){
      var full = m[1].trim(), base = full.replace(/\s*\(.*\)\s*$/,'').trim(), variant = (/\((.*)\)\s*$/.exec(full)||[])[1]||'';
      var q = parseInt(m[2],10), tot = parseMoney(m[3]);
      var nb = norm(base);
      var p = DB.produits.find(function(x){return norm(x.nom)===nb;}) || DB.produits.find(function(x){return norm(x.nom).indexOf(nb)>=0 || nb.indexOf(norm(x.nom))>=0;});
      res.lignes.push({ nom:base, variante:variant, qte:q, total:tot, produitId:p?p.id:'' });
    }
    else if((m = /^Nom\s*:\s*(.+)/i.exec(l))) res.client = m[1].trim();
    else if((m = /^T[ée]l\s*:\s*(.+)/i.exec(l))) res.tel = m[1].trim();
    else if((m = /^(Livraison|Retrait[^:]*)(?::\s*(.+))?$/i.exec(l))) res.mode = m[1] + (m[2]?' : '+m[2]:'');
    else if((m = /^Pr[ée]cisions\s*:\s*(.+)/i.exec(l))) res.note = m[1].trim();
  });
  res.total = res.lignes.reduce(function(a,l){return a+l.total;},0);
  return res;
}
function cmdAnalyserClick(){
  var t = document.getElementById('cmdTxt').value; cmdTexte = t;
  var r = analyserCommande(t);
  if(!r.lignes.length){ showToast('Aucune ligne de commande reconnue'); cmdAnalyse = null; renderers.produits(); return; }
  cmdAnalyse = r; renderers.produits();
}
function cmdImporter(){
  var r = cmdAnalyse; if(!r) return;
  if(r.num && DB.commandes.some(function(c){return c.num===r.num;})){ showToast('Cette commande est déjà importée'); return; }
  var num = r.num || ('CMD-'+Date.now().toString(36).toUpperCase());
  var manque = r.lignes.filter(function(l){ var p = DB.produits.find(function(x){return x.id===l.produitId;}); return p && l.qte > stockRestant(p); });
  var n = 0;
  r.lignes.forEach(function(l){
    var p = DB.produits.find(function(x){return x.id===l.produitId;}); if(!p) return;
    var c = produitCalc(p), numero = consumeNumero('vente');

  });

/* ================= CODES D'ACCÈS ================= */
function sha256(str){
  var K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  var H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  var bytes=unescape(encodeURIComponent(str)), n=bytes.length, i, j;
  var words=[];
  for(i=0;i<n;i++) words[i>>2] |= bytes.charCodeAt(i) << (24-(i%4)*8);
  words[n>>2] |= 0x80 << (24-(n%4)*8);
  var total = (((n+8)>>6)+1)*16;
  for(i=0;i<total;i++) if(words[i]===undefined) words[i]=0;
  words[total-1] = n*8;
  function R(x,k){ return (x>>>k)|(x<<(32-k)); }
  for(var off=0; off<total; off+=16){
    var W=words.slice(off,off+16);
    for(i=16;i<64;i++){
      var s0=R(W[i-15],7)^R(W[i-15],18)^(W[i-15]>>>3), s1=R(W[i-2],17)^R(W[i-2],19)^(W[i-2]>>>10);
      W[i]=(W[i-16]+s0+W[i-7]+s1)|0;
    }
    var a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for(i=0;i<64;i++){
      var S1=R(e,6)^R(e,11)^R(e,25), ch=(e&f)^(~e&g), t1=(h+S1+ch+K[i]+W[i])|0;
      var S0=R(a,2)^R(a,13)^R(a,22), mj=(a&b)^(a&c)^(b&c), t2=(S0+mj)|0;
      h=g; g=f; f=e; e=(d+t1)|0; d=c; c=b; b=a; a=(t1+t2)|0;
    }
    H[0]=(H[0]+a)|0; H[1]=(H[1]+b)|0; H[2]=(H[2]+c)|0; H[3]=(H[3]+d)|0; H[4]=(H[4]+e)|0; H[5]=(H[5]+f)|0; H[6]=(H[6]+g)|0; H[7]=(H[7]+h)|0;
  }
  var out='';
  for(i=0;i<8;i++){ out += ('00000000'+(H[i]>>>0).toString(16)).slice(-8); }
  return out;
}
function hashCode(code){ return sha256('dallas-avenue|'+String(code)); }

var SESSION = null, lockBuf = '', lockFails = 0, lockUntil = 0, lastActivity = Date.now(), hiddenAt = 0;
function isAdmin(){ return !!SESSION && SESSION.role==='admin'; }
var lockChoisi = null;
function choisirUtilisateur(id){
  lockChoisi = id;
  var u = DB.utilisateurs.find(function(x){return x.id===id;});
  document.querySelectorAll('.lockuser').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-uid')===id); });
  var sub = document.querySelector('#lock .sub');
  if(sub) sub.textContent = u ? 'Code de '+u.nom : 'Entre ton code d\'accès';
  var li = document.getElementById('lockInput'); if(li){ li.value=''; lockBuf=''; li.focus(); }
  var msg = document.getElementById('lockMsg'); if(msg) msg.textContent='';
}
function showLock(msg){
  SESSION = null; lockBuf = ''; lockChoisi = null;
  document.body.classList.add('locked'); document.body.classList.remove('role-caisse');
  var el = document.getElementById('lock'); el.style.display = 'flex';
  var b = document.getElementById('lockBtn'); if(b) b.style.display = 'none';
  el.innerHTML = '<img src="'+document.querySelector('header.topbar img').src+'" alt="">' +
    '<h1>DALLAS AVENUE</h1><div class="sub">Entre ton code d\'accès</div>' +
    '<div class="lockusers">' + DB.utilisateurs.map(function(u){
      return '<button class="lockuser" data-uid="'+escHtml(u.id)+'" onclick="choisirUtilisateur(\''+escHtml(u.id)+'\')">'+escHtml(u.nom)+'<small>'+(u.role==='admin'?'Administrateur':'Vente seulement')+'</small></button>';
    }).join('') + '</div>' +
    '<input id="lockInput" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" maxlength="8" placeholder="Code" class="lockinput">' +
    '<div class="msg" id="lockMsg">'+(msg||'')+'</div>' +
    '<div class="pad">' + [1,2,3,4,5,6,7,8,9].map(function(n){return '<button onclick="lockKey(\''+n+'\')">'+n+'</button>';}).join('') +
    '<button onclick="lockKey(\'del\')">&#9003;</button><button onclick="lockKey(\'0\')">0</button><button class="ok" onclick="lockKey(\'ok\')">OK</button></div>';
}
function lockDraw(){
  var li = document.getElementById('lockInput'); if(li && li.value !== lockBuf) li.value = lockBuf;
  var d = document.getElementById('lockDots'); if(d) d.textContent = new Array(lockBuf.length+1).join('●');
}
function lockFromInput(){
  var li = document.getElementById('lockInput'); if(!li) return;
  lockBuf = li.value.replace(/\D/g,'').slice(0,8);
  var msg = document.getElementById('lockMsg'); if(msg) msg.textContent = '';
}
function lockKey(k){
  var msg = document.getElementById('lockMsg');
  if(Date.now() < lockUntil){ msg.textContent = 'Trop d\'essais. Patiente quelques secondes.'; return; }
  if(k==='del'){ lockBuf = lockBuf.slice(0,-1); }
  else if(k==='ok'){ lockSubmit(); return; }
  else if(lockBuf.length < 8){ lockBuf += k; }
  msg.textContent = ''; lockDraw();
}
function lockSubmit(){
  var msg = document.getElementById('lockMsg');
  if(!lockBuf){ return; }
  var h = hashCode(lockBuf);
  var u = DB.utilisateurs.find(function(x){return x.hash===h;});
  if(u && lockChoisi && u.id!==lockChoisi){
    lockFails++; lockBuf = ''; lockDraw();
    msg.textContent = 'Ce code ne correspond pas à l\'utilisateur choisi';
    return;
  }
  if(!u){
    lockFails++; lockBuf = ''; lockDraw();
    if(lockFails >= 5){ lockUntil = Date.now()+30000; lockFails = 0; msg.textContent = 'Trop d\'essais : attends 30 secondes.'; }
    else msg.textContent = 'Code incorrect';
    return;
  }
  lockFails = 0; SESSION = { id:u.id, nom:u.nom, role:u.role, hash:u.hash };
  document.getElementById('lock').style.display = 'none';
  document.body.classList.remove('locked');
  document.body.classList.toggle('role-caisse', u.role!=='admin');
  var b = document.getElementById('lockBtn'); b.style.display = 'block'; b.innerHTML = '&#128274;'; b.title = 'Verrouiller (' + u.nom + ')';
  lastActivity = Date.now();
  switchTab(u.role==='admin' ? 'accueil' : 'produits');
}
function verrouiller(){ showLock(''); }
function revalidateSession(){
  if(!SESSION) return;
  var u = DB.utilisateurs.find(function(x){return x.id===SESSION.id;});
  if(!u || u.hash!==SESSION.hash || u.role!==SESSION.role) showLock('Session mise à jour : reconnecte-toi');
}
['click','touchstart','keydown'].forEach(function(ev){ document.addEventListener(ev, function(){ lastActivity = Date.now(); }, true); });
setInterval(function(){ if(SESSION && Date.now()-lastActivity > 10*60*1000) showLock('Verrouillé après inactivité'); }, 15000);
document.addEventListener('visibilitychange', function(){
  if(document.hidden){ hiddenAt = Date.now(); }
  else if(SESSION && hiddenAt && Date.now()-hiddenAt > 2*60*1000){ showLock('Verrouillé'); }
});
document.addEventListener('input', function(e){
  if(e.target && e.target.id==='lockInput') lockFromInput();
});
document.addEventListener('keydown', function(e){
  if(e.target && e.target.id==='lockInput'){
    if(e.key==='Enter'){ e.preventDefault(); lockFromInput(); lockSubmit(); }
    return;
  }
  if(!SESSION && document.getElementById('lock').style.display!=='none'){
    if(/^[0-9]$/.test(e.key)) lockKey(e.key); else if(e.key==='Backspace') lockKey('del'); else if(e.key==='Enter') lockKey('ok');
  }
});

function codeValide(c, exceptId){
  if(!/^\d{4,8}$/.test(c)){ showToast('Le code doit avoir 4 à 8 chiffres'); return false; }
  var h = hashCode(c);
  if(DB.utilisateurs.some(function(u){return u.hash===h && u.id!==exceptId;})){ showToast('Ce code est déjà utilisé'); return false; }
  return true;
}
function ajouterUtilisateur(){
  if(!isAdmin()) return;
  var nom = document.getElementById('nuNom').value.trim(), role = document.getElementById('nuRole').value, c = document.getElementById('nuCode').value.trim();
  if(!nom){ showToast('Nom requis'); return; }
  if(!codeValide(c)) return;
  DB.utilisateurs.push({ id:uid(), nom:nom, role:role, hash:hashCode(c) });
  saveKey(KEYS.utilisateurs, DB.utilisateurs); showToast('Accès ajouté'); renderers.finances();
}
function changerCode(id){
  if(!isAdmin()) return;
  var c = document.getElementById('newcode_'+id).value.trim();
  if(!codeValide(c, id)) return;
  var u = DB.utilisateurs.find(function(x){return x.id===id;}); u.hash = hashCode(c);
  if(SESSION && SESSION.id===id) SESSION.hash = u.hash;
  saveKey(KEYS.utilisateurs, DB.utilisateurs); showToast('Code modifié'); renderers.finances();
}
function supprimerUtilisateur(id){
  if(!isAdmin()) return;
  var u = DB.utilisateurs.find(function(x){return x.id===id;}); if(!u) return;
  if(u.role==='admin' && DB.utilisateurs.filter(function(x){return x.role==='admin';}).length<=1){ showToast('Garde au moins un administrateur'); return; }
  DB.utilisateurs = DB.utilisateurs.filter(function(x){return x.id!==id;});
  saveKey(KEYS.utilisateurs, DB.utilisateurs); showToast('Accès retiré'); renderers.finances();
}

/* ================= LIAISON AVEC LA BOUTIQUE EN LIGNE ================= */
var BOUTIQUE_URL = 'https://nioro762.github.io';
function setCategorieProduit(id, val){
  var p = DB.produits.find(function(x){return x.id===id;}); if(!p) return;
  if(val==='__new__'){ val = nouvelleCategorie(); if(!val){ renderers.produits(); return; } }
  p.categorie = String(val||'').trim(); saveKey(KEYS.produits, DB.produits);
  showToast(p.categorie ? 'En ligne : '+p.categorie : 'Retiré de la boutique'); renderers.produits();
}
function boutiqueHtml(){
  var cfg = ghConfig();
  var en = DB.produits.filter(function(p){return p.categorie && String(p.categorie).trim();});
  var hors = DB.produits.length - en.length;
  var last = ''; try{ last = localStorage.getItem('da_last_pub')||''; }catch(e){}
  var rows = DB.produits.slice().sort(function(a,b){
    var ea = a.categorie?0:1, eb = b.categorie?0:1; return ea-eb || a.nom.localeCompare(b.nom);
  }).map(function(p){
    var on = !!(p.categorie && String(p.categorie).trim()), r = stockRestant(p);
    var alertes = [];
    if(on && !p.photo) alertes.push('sans photo');
    if(on && !p.description) alertes.push('sans description');
    if(on && r<=0) alertes.push('épuisé : affiché comme tel');
    return '<div class="card"><div class="row"><span style="font-weight:600;">'+escHtml(p.nom)+'</span><span class="pill'+(on?'':' alert')+'">'+(on?'En ligne':'Hors ligne')+'</span></div>' +
      '<div class="meta">'+fmt(p.prixVente)+' &middot; stock '+r+(alertes.length?' &middot; <span style="color:var(--danger);">'+alertes.join(', ')+'</span>':'')+'</div>' +
      '<div class="qs">'+selectCategorie('', p.categorie, "setCategorieProduit(\'"+p.id+"\',this.value)")+
      '<button class="btn secondary small" onclick="allerEdition(\''+p.id+'\')">Fiche</button></div></div>';
  }).join('') || '<div class="empty">Aucun produit.</div>';
  return '<div class="card"><div style="font-weight:600;margin-bottom:6px;">&#128722; Ma boutique en ligne</div>' +
      '<div class="row"><span class="meta">Adresse</span><a href="'+BOUTIQUE_URL+'" target="_blank" rel="noopener" style="color:var(--text);font-weight:600;">nioro762.github.io</a></div>' +
      '<div class="row"><span class="meta">Produits en ligne</span><b>'+en.length+'</b></div>' +
      '<div class="row"><span class="meta">Produits hors ligne</span><b>'+hors+'</b></div>' +
      '<div class="row"><span class="meta">Dernière publication</span><span>'+(last?new Date(last).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'jamais (sur cet appareil)')+'</span></div>' +
      '<button class="btn block" style="margin-top:10px;" onclick="publierBoutique()">'+(cfg.token?'Publier la boutique maintenant':'Préparer le fichier boutique.json')+'</button>' +
      '<div class="meta" style="margin-top:8px;">'+(cfg.token?'Publication directe activée : la boutique se met à jour en une minute environ.':'Publication directe non activée : le fichier boutique.json est téléchargé, à déposer sur le dépôt NIORO762.github.io.')+'</div>' +
      '<a class="btn secondary block" style="margin-top:8px;text-align:center;text-decoration:none;" href="'+BOUTIQUE_URL+'" target="_blank" rel="noopener">Voir la boutique</a>' +
    '</div>' +
    '<div class="banner-note">Un produit est en ligne dès qu\'il a une <b>catégorie</b>. Les prix d\'achat et les marges ne sont jamais publiés. Le stock est mis à jour à chaque publication.</div>' +
        rows +
    '<details class="pd" style="margin-top:12px;"><summary>Réglages de publication directe</summary>' +
      '<div class="card" style="margin-top:8px;"><label>Dépôt GitHub de la boutique</label><input type="text" id="ghRepo" value="'+escHtml(cfg.repo)+'" autocapitalize="off">' +
      '<label>Clé d\'accès GitHub (reste sur cet appareil)</label><input type="password" id="ghToken" placeholder="'+(cfg.token?'Clé enregistrée (laisser vide pour garder)':'Colle la clé ici')+'" autocomplete="off">' +
      '<button class="btn secondary block" style="margin-top:8px;" onclick="ghSave()">Enregistrer</button>' +
      (cfg.token?'<button class="btn secondary block" style="margin-top:8px;" onclick="ghClear()">Retirer la clé</button>':'') + '</div></details>';
}
function allerEdition(id){ produitsSub = 'catalogue'; renderers.produits(); if(id) editProduit(id); var d = document.getElementById('prodFormDet'); if(d) d.open = true; }

  registerPWA();
